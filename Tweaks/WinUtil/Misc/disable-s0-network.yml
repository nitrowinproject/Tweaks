---
title: Disable S0 Sleep Network Connectivity
description: Disables network connectivity during S0 Sleep which is low power idle in modern laptops
actions:
  - !registryValue:
    path: 'HKCU\SOFTWARE\Policies\Microsoft\Power\PowerSettings\f15576e8-98b7-4186-b944-eafa664402d9'
    value: "ACSettingIndex"
    data: "0"
    type: REG_DWORD
    platforms:
      desktop: false
